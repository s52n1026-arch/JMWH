    }

    function judgementHtml(index) {
      const answer = getAnswer(index);
      if (!answer) return '<span class="judgement none">未回答</span>';
      return isCorrect(index) ? '<span class="judgement ok">正解</span>' : '<span class="judgement bad">不正解</span>';
    }

    function renderExplanations() {
      const root = document.getElementById('explanationsRoot');
      root.innerHTML = QUESTIONS.map((q, i) => {
        const num = i + 1;
        const choices = LETTERS.map(letter => `<div><strong>${letter}.</strong> ${esc(q.choices[letter])}</div>`).join('');
        const comments = LETTERS.map(letter => `<div class="option-comment"><strong>${letter}</strong> ${esc(q.comments[letter])}</div>`).join('');
        const refs = (q.refs || []).map(ref => `<li>${esc(ref)}</li>`).join('');
        return `
          <article class="explanation-card" id="explanation-${num}" aria-labelledby="explanation-title-${num}">
            <h3 id="explanation-title-${num}">第${num}問</h3>
            <div class="theme">関連テーマ：${esc(q.theme)}</div>
            <div class="reprint">
              <strong>問題文の再掲</strong>
              <p class="stem">${esc(q.stem)}</p>
              <div>${choices}</div>
            </div>
            <p class="answer-line">答案者の回答：<span id="explain-answer-${i}">未回答</span> <span id="judge-${i}">${judgementHtml(i)}</span></p>
            <p class="answer-line">正答：${esc(q.correct.join(''))}</p>
            <div class="key-point"><strong>正解の根拠：</strong>${esc(q.lead)}</div>
            <h4>各選択肢へのコメント</h4>
            ${comments}
            <div class="refs">
              <strong>根拠・出題意図</strong>
              <ul>${refs}</ul>
            </div>
          </article>`;
      }).join('');
    }

    function syncQuestion(index) {
      const answer = getAnswer(index);
      const input = document.getElementById(`answer-${index}`);
      const memo = document.getElementById(`memo-${index}`);
      if (input) input.value = answer;
      if (memo) memo.value = getMemo(index);
      document.querySelectorAll(`.choice[data-question="${index}"]`).forEach(button => {
        const selected = answer.includes(button.dataset.letter);
        button.setAttribute('aria-pressed', selected ? 'true' : 'false');
      });
      const explainAnswer = document.getElementById(`explain-answer-${index}`);
      if (explainAnswer) explainAnswer.textContent = answer || '未回答';
      const judge = document.getElementById(`judge-${index}`);
      if (judge) judge.innerHTML = judgementHtml(index);
    }

    function syncAll() {
      QUESTIONS.forEach((_, i) => syncQuestion(i));
      renderSummary();
    }

    function updateAnswer(index, value) {
      const normalized = normalizeAnswer(value);
      if (normalized) state.answers[index] = normalized;
      else delete state.answers[index];
      saveState();
      syncQuestion(index);
      renderSummary();
    }

    function updateMemo(index, value) {
      if (value) state.memos[index] = value;
      else delete state.memos[index];
      saveState();
      renderSummary();
    }

    function bindEvents() {
      document.getElementById('questionsRoot').addEventListener('click', event => {
        const button = event.target.closest('.choice');
        if (!button) return;
        const index = Number(button.dataset.question);
        const letter = button.dataset.letter;
        const current = getAnswer(index);
        const next = current === letter ? '' : letter;
        updateAnswer(index, next);
      });

      document.getElementById('questionsRoot').addEventListener('input', event => {
        const target = event.target;
        if (target.classList.contains('answer-input')) {
          const index = Number(target.dataset.question);
          const normalized = normalizeAnswer(target.value);
          target.value = normalized;
          updateAnswer(index, normalized);
        }
        if (target.classList.contains('memo-input')) {
          updateMemo(Number(target.dataset.question), target.value);
        }
      });

      document.getElementById('clearButton').addEventListener('click', () => {
        if (!confirm('回答とメモをすべて消去します。よろしいですか？')) return;
        state.answers = {};
        state.memos = {};
        if (storageAvailable) {
          try { localStorage.removeItem(STORAGE_KEY); } catch (error) { storageAvailable = false; }
        }
        syncAll();
        setStatus('storageStatus', '入力内容を消去しました。');
      });

      document.getElementById('copyButton').addEventListener('click', copySummary);
    }

    function summaryText() {
      return QUESTIONS.map((_, i) => `第${i + 1}問\n回答：${getAnswer(i) || '未回答'}\nメモ：${getMemo(i) || ''}`).join('\n\n');
    }

    async function copySummary() {
      const text = summaryText();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.getElementById('copyFallback');
          textarea.value = text;
          textarea.focus();
          textarea.select();
          const ok = document.execCommand('copy');
          if (!ok) throw new Error('execCommand failed');
        }
        setStatus('copyStatus', 'コピーしました。');
      } catch (error) {
        setStatus('copyStatus', 'コピーできませんでした。まとめ欄を選択して手動でコピーしてください。');
      }
    }

    renderQuestions();
    renderExplanations();
    loadState();
    bindEvents();
    syncAll();
  </script>
</body>
</html>
