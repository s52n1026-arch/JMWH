<script>
const QUESTIONS=[{"number":1,"theme":"思春期の正常発達と評価","stem":"11歳6か月。片側の乳房腫脹を主訴に受診した。身長は過去1年で6.2 cm増加し、陰毛はTanner 1度、乳房はTanner 2度相当で、外陰出血はない。母は「左右差があるので病気ではないか」と不安を訴える。評価として適切なものを全て選べ。","choices":{"A":"乳房発育の開始時期、身長速度、成長曲線、骨年齢を組み合わせて経過を判断する。","B":"陰毛がまだないため、卵巣性エストロゲン作用は生じていないと判断する。","C":"片側性の乳房発育であっても、発育初期の左右差として経過観察しうる。","D":"初経は乳房発育開始からおよそ2年後に来ることが多く、身長スパート後に近づく。","E":"骨年齢が暦年齢より2年以上遅れていれば、進行の速い病態として扱う。"},"correct":["A","C","D"],"comments":{"A":"正しい。年齢だけでなく、Tanner分類、成長速度、成長曲線、骨年齢を合わせて正常変異と病的異常を分ける。","B":"誤り。乳房発育はエストロゲン作用を反映し、陰毛発育は副腎性アンドロゲンの軸も関与するため別に評価する。","C":"正しい。乳房発育初期には左右差を伴うことがあり、急速進行や腫瘤所見がなければ経過をみる。","D":"正しい。乳房発育、身長スパート、初経の時間関係を整理して説明する。","E":"誤り。進行の速いエストロゲン曝露では骨年齢は促進しやすく、遅延は体質性遅発など別の鑑別を考える。"},"rationale":"本問は、乳房発育と陰毛発育を同じ軸で扱わないこと、成長速度と骨年齢を加えて進行性を判断することを問う。正常変異では、年齢の1点より成長曲線上の推移が重要になる。","references":["Palmert MR, Dunkel L. Delayed puberty. N Engl J Med. 2012;366:443-453. DOI:10.1056/NEJMcp1109290. 反映: 思春期評価でTanner分類、成長曲線、骨年齢を統合する基本。","Kaplowitz PB. Update on precocious puberty. Curr Opin Endocrinol Diabetes Obes. 2020;27:57-64. DOI:10.1097/MED.0000000000000525. 反映: 正常変異と進行性病態の見分け方。直近5年内の包括的指針は確認困難。"],"numeric":true},{"number":2,"theme":"思春期早発症","stem":"7歳4か月。6か月前から乳房発育が進み、身長速度は年10 cm、骨年齢は9歳相当であった。陰毛は軽度で、外陰出血はない。基礎LHは測定感度付近、超音波で卵巣に小嚢胞を認める。次の判断として適切なものを全て選べ。","choices":{"A":"中枢性が疑われる場合、GnRH刺激でLH優位の反応を確認することが診断の助けになる。","B":"6歳未満の女児、神経症状、急速進行などでは中枢性病変検索として頭部MRIを検討する。","C":"卵巣嚢胞を認めれば、GnRH依存性の進行は否定できる。","D":"骨年齢が促進していても、暦年齢が8歳未満でなければ評価は不要である。","E":"末梢性が疑われる場合は、卵巣腫瘍、副腎疾患、外因性エストロゲンを検索対象に入れる。"},"correct":["A","B","E"],"comments":{"A":"正しい。進行性の二次性徴ではGnRH依存性かどうかをLH反応で評価する。","B":"正しい。低年齢、神経症状、急速進行などは頭蓋内病変を考える条件になる。","C":"誤り。卵巣嚢胞は末梢性の原因にもなるが、所見だけで中枢性を否定しない。","D":"誤り。8歳未満の乳房発育、身長速度増加、骨年齢促進は評価対象である。","E":"正しい。卵巣・副腎・外因性エストロゲンの検索は末梢性を疑う場合に必要である。"},"rationale":"骨年齢促進と身長速度増加は、単なる早めの乳房発育より進行性を示す。GnRH刺激試験、骨年齢、画像、神経症状を組み合わせ、末梢性を疑う所見が強いときには卵巣・副腎・外因性を検索する。","references":["Korean Society of Pediatric Endocrinology. 2022 Clinical practice guidelines for central precocious puberty of Korean children and adolescents. Ann Pediatr Endocrinol Metab. 2022. URL:https://e-apem.org. 反映: GnRH刺激試験とMRI適応。","Kaplowitz PB. Update on precocious puberty. Curr Opin Endocrinol Diabetes Obes. 2020;27:57-64. DOI:10.1097/MED.0000000000000525. 反映: 進行速度、骨年齢、頭部画像適応。"],"numeric":true},{"number":3,"theme":"思春期遅発症","stem":"14歳3か月。初経はなく、乳房発育はTanner 1度。身長は-2.3 SDで、成長曲線では小児期から低身長が続く。外反肘と軽い翼状頸を認める。FSH 82 mIU/mL、LH 36 mIU/mL、E2低値であった。適切な評価・説明を全て選べ。","choices":{"A":"高ゴナドトロピン性の性腺機能低下として、核型検査を行う。","B":"Y染色体成分が検出された場合、性腺腫瘍リスクを踏まえて性腺管理を検討する。","C":"低身長があるため、FSH高値は体質性遅発の所見として扱う。","D":"乳房発育が乏しければ、心血管・腎・甲状腺などの合併評価は不要である。","E":"二次性徴誘導では、骨年齢や成長余地を見ながら低用量エストロゲンを段階的に用いる。"},"correct":["A","B","E"],"comments":{"A":"正しい。FSH高値かつE2低値なら卵巣原発性の機能低下を考え、染色体評価を行う。","B":"正しい。Y成分を伴う性腺形成不全では性腺芽腫などのリスクが問題になる。","C":"誤り。体質性遅発では低ゴナドトロピン寄りで、FSH高値は性腺機能不全を示す。","D":"誤り。低身長と身体所見があれば、Turner症候群を念頭に全身合併症を評価する。","E":"正しい。思春期誘導は急に成人量へ進めず、成長と子宮発育も考慮する。"},"rationale":"14歳で乳房発育がない場合は遅発として評価する。FSH高値なら高ゴナドトロピン性、低値なら中枢性・機能性に分け、低身長や外表所見があれば染色体異常を見逃さない。","references":["ESHRE/ASRM/CRE WHiRL. Evidence-based guideline: Premature Ovarian Insufficiency. 2024. URL:https://www.eshre.eu/Guidelines-and-Legal/Guidelines/Premature-ovarian-insufficiency. 反映: FSH高値、染色体評価、長期管理。","Gravholt CH, et al. Clinical practice guidelines for Turner syndrome. Eur J Endocrinol. 2024 update page. URL:https://www.ese-hormones.org. 反映: Turner症候群の全身評価。"],"numeric":true},{"number":4,"theme":"原発性無月経","stem":"17歳。初経がなく受診した。乳房発育はTanner 5度、外陰は女性型だが陰毛は乏しい。経腹超音波とMRIで子宮を認めず、両側鼠径管内に性腺様構造を認める。対応として適切なものを全て選べ。","choices":{"A":"46,XXで卵巣機能が保たれる病態として説明し、性腺腫瘍リスクは考えない。","B":"陰毛が乏しいことから、ミュラー管形成不全だけで説明できると判断する。","C":"核型検査とアンドロゲン受容体関連の評価を行い、本人への段階的な説明を計画する。","D":"性腺摘出の時期は、腫瘍リスクと自然な二次性徴完了を考慮して個別に検討する。","E":"妊孕性、性機能、心理支援、プライバシーを含めた多職種支援を行う。"},"correct":["C","D","E"],"comments":{"A":"誤り。子宮欠如と鼠径部性腺、陰毛乏少は46,XY DSDを考える。","B":"誤り。陰毛乏少はアンドロゲン作用不全を示唆し、鑑別を狭める重要所見である。","C":"正しい。診断は染色体・ホルモン・画像を統合し、情報開示は心理面に配慮する。","D":"正しい。完全型アンドロゲン不応症では性腺管理の時期を一律に急がず個別化する。","E":"正しい。診断名の提示だけでなく、性機能、妊孕性、心理支援が問われる。"},"rationale":"乳房発育あり・子宮なしでは、陰毛の有無がMRKH症候群と完全型アンドロゲン不応症の鑑別に効く。診断確定と本人支援を同時に進める。","references":["ASRM Practice Committee. Current evaluation of amenorrhea: a committee opinion. 2024. URL:https://www.asrm.org/practice-guidance/practice-committee-documents/current-evaluation-of-amenorrhea-a-committee-opinion-2024/. 反映: 乳房発育、子宮、FSH/LH、染色体による原発性無月経評価。","Cools M, et al. Caring for individuals with a difference of sex development. Nat Rev Endocrinol. 2018;14:415-429. DOI:10.1038/s41574-018-0010-8. 反映: DSDの多職種支援。直近5年内の同等包括文献は確認困難。"],"numeric":false},{"number":5,"theme":"続発性無月経","stem":"29歳。分娩後の大量出血で輸血歴があり、その後1年半、月経が戻らない。授乳は終了している。妊娠反応陰性、PRL正常、FSH 4 mIU/mL、LH 2 mIU/mL、E2低値。疲労感と腋毛減少を訴える。対応として適切なものを全て選べ。","choices":{"A":"妊娠を除外したうえで、TSH、FT4、ACTH、コルチゾールなど下垂体前葉機能を評価する。","B":"FSH低値なので卵巣機能は十分と判断し、以後の内分泌評価を行わない。","C":"プロゲスチン負荷試験で出血がなければ、流出路閉鎖だけを原因とする。","D":"重症産科出血後の低ゴナドトロピン性低エストロゲン状態として、下垂体障害を鑑別する。","E":"月経再開だけを目的にエストロゲンを先行し、副腎不全評価は後回しにする。"},"correct":["A","D"],"comments":{"A":"正しい。続発性無月経では妊娠除外後に、甲状腺・PRL・ゴナドトロピン・E2を軸に評価する。","B":"誤り。FSH低値とE2低値は中枢性低ゴナドトロピン性を示す。","C":"誤り。低エストロゲンでも出血は起こりにくく、流出路だけに短絡しない。","D":"正しい。大量出血後の下垂体機能低下を念頭に置く。","E":"誤り。副腎不全が疑われる場合は生命リスクがあり、評価と治療順序に注意する。"},"rationale":"続発性無月経では妊娠を最初に除外し、その後に中枢性・卵巣性・甲状腺・PRL・子宮性を整理する。産科大量出血後では下垂体障害を見落とさない。","references":["ASRM Practice Committee. Current evaluation of amenorrhea: a committee opinion. 2024. URL:https://www.asrm.org/practice-guidance/practice-committee-documents/current-evaluation-of-amenorrhea-a-committee-opinion-2024/. 反映: 続発性無月経の初期検査。","Endocrine Society. Hormonal replacement in hypopituitarism in adults: clinical practice guideline. J Clin Endocrinol Metab. 2016;101:3888-3921. DOI:10.1210/jc.2016-2118. 反映: 下垂体機能低下症の評価。直近5年内の同等包括指針は確認困難。"],"numeric":true},{"number":6,"theme":"やせ・摂食障害に伴う視床下部性無月経","stem":"20歳。半年で体重が9 kg減少し、BMI 17.1。月経は5か月停止している。妊娠反応陰性、FSH 5 mIU/mL、LH 1 mIU/mL、E2 18 pg/mL。疲労骨折歴があり、本人は「出血だけ戻したい」と希望する。対応として適切なものを全て選べ。","choices":{"A":"LEPで消退出血を作れば、低栄養が残っていても骨量低下は治療できる。","B":"摂取量、運動量、心理ストレスを評価し、栄養介入と心理支援を優先する。","C":"6か月未満でも骨脆弱性や栄養不足が強ければDXAを検討する。","D":"低E2でも妊娠可能性はないため、性行為歴の確認は不要である。","E":"電解質、徐脈、低血圧など身体的重症度を評価し、必要時は専門治療へつなぐ。"},"correct":["B","C","E"],"comments":{"A":"誤り。消退出血は根本治療ではなく、低エネルギー可用性が残ると骨リスクは続く。","B":"正しい。エネルギー可用性の回復が治療の中心である。","C":"正しい。無月経6か月以上が一つの目安だが、疲労骨折や栄養不足があれば早期評価を考える。","D":"誤り。無月経でも排卵が完全に否定されるわけではなく、妊娠除外は必要である。","E":"正しい。摂食障害では循環動態や電解質異常を含む安全評価が必要になる。"},"rationale":"低栄養性の低ゴナドトロピン性無月経では、出血を作ることより栄養・心理・運動調整・骨評価が中心である。疲労骨折があれば骨密度評価を早める。","references":["Gordon CM, et al. Functional hypothalamic amenorrhea: an Endocrine Society clinical practice guideline. J Clin Endocrinol Metab. 2017;102:1413-1439. DOI:10.1210/jc.2017-00131. 反映: FHAの診断、DXA、OCを骨治療目的にしない点。近5年内の同等包括指針は確認困難。","NICE. Eating disorders: recognition and treatment. NG69, updated 2020. URL:https://www.nice.org.uk/guidance/ng69. 反映: 摂食障害の身体評価と心理支援。"],"numeric":true},{"number":7,"theme":"女性アスリートの健康管理","stem":"18歳。長距離選手。BMI 19.0だが、摂取量を制限し、週90 km走っている。月経は4か月停止し、脛骨疲労骨折で休部中。Hbは正常、フェリチンは12 ng/mL。対応として適切なものを全て選べ。","choices":{"A":"正常BMIでも、摂取エネルギーと運動消費の不均衡があれば多臓器の問題が起こりうる。","B":"Hbが正常であれば、鉄欠乏は疲労や競技力低下の評価対象から外す。","C":"栄養、競技負荷、心理、骨、鉄代謝を多職種で評価し、復帰可否を段階的に判断する。","D":"月経停止を隠す形でLEPだけを開始するより、エネルギー可用性の回復を治療目標にする。","E":"骨折が治癒すれば、月経停止が続いていても競技負荷を元に戻してよい。"},"correct":["A","C","D"],"comments":{"A":"正しい。低エネルギー可用性は体重だけでは判定できない。","B":"誤り。貧血前の鉄欠乏でも疲労、集中力、持久力に関係しうる。","C":"正しい。栄養士、心理職、指導者、医療者を含む安全な復帰計画が必要である。","D":"正しい。出血を作る治療だけでは骨と全身状態を守れない。","E":"誤り。月経停止と低エネルギー可用性が続けば再骨折リスクが残る。"},"rationale":"RED-Sでは正常BMIでも低エネルギー可用性が問題になる。骨折、無月経、鉄欠乏、心理・競技環境を一体として評価する。","references":["Mountjoy M, et al. 2023 International Olympic Committee consensus statement on Relative Energy Deficiency in Sport. Br J Sports Med. 2023. DOI:10.1136/bjsports-2023-106994. 反映: RED-Sの多系統影響と多職種管理。","Sim M, et al. Iron considerations for the athlete: a narrative review. Eur J Appl Physiol. 2019;119:1463-1478. DOI:10.1007/s00421-019-04157-y. 反映: 貧血前鉄欠乏の評価。直近5年内の主要指針は確認困難。"],"numeric":true},{"number":8,"theme":"月経困難症","stem":"16歳。初経後2年から月経痛が強く、学校を休む。市販鎮痛薬を痛みが我慢できなくなってから1回だけ内服している。性交歴はない。超音波では明らかな腫瘤を認めない。対応として適切なものを全て選べ。","choices":{"A":"性交歴がなければ、骨盤内病変の可能性は考えなくてよい。","B":"NSAIDsは月経開始直前または痛みの早期から十分量を規則的に用いるよう指導する。","C":"超音波で嚢胞がなければ、若年者の内膜症関連疼痛は否定できる。","D":"症状が強くても、学校生活への影響は治療選択に含めない。","E":"NSAIDs不十分例では、本人の希望と禁忌を確認してホルモン療法を検討する。"},"correct":["B","E"],"comments":{"A":"誤り。性交歴の有無で内膜症や形態異常を除外しない。","B":"正しい。プロスタグランジン産生を抑えるため、痛みが強くなる前から使う。","C":"誤り。表在性病変は画像で見えにくく、症状経過が重要である。","D":"誤り。欠席や活動制限は重症度と治療選択に関わる。","E":"正しい。NSAIDsで不十分ならLEPなどを検討する。"},"rationale":"原発性ではNSAIDsのタイミングが重要で、続発性では若年者の内膜症を見逃さない。画像陰性でも治療反応と症状をみる。","references":["ACOG Committee Opinion No. 760. Dysmenorrhea and endometriosis in the adolescent. Obstet Gynecol. 2018. URL:https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2018/12/dysmenorrhea-and-endometriosis-in-the-adolescent. 反映: NSAIDs、ホルモン療法、若年内膜症の見逃し防止。直近5年内の同等包括指針は確認困難。","NICE. Endometriosis: diagnosis and management. NG73, updated 2024. URL:https://www.nice.org.uk/guidance/ng73. 反映: 症状に基づく疑いと紹介。"],"numeric":false},{"number":9,"theme":"子宮内膜症","stem":"31歳。強い月経痛、排便痛、性交痛があり、1年以内の妊娠を希望している。右卵巣に4.5 cmの均一な低エコー嚢胞を認め、CA125は軽度高値、AMHは年齢相応下限。悪性を疑う充実部はない。説明として適切なものを全て選べ。","choices":{"A":"症状と画像から臨床的に診断し、腹腔鏡を診断のためだけに必須とはしない。","B":"手術は疼痛改善や不妊治療前処置として意義がありうるが、卵巣予備能低下を説明する。","C":"妊娠希望が近い場合、薬物で排卵を抑える治療は妊娠成立を同時に高める治療ではない。","D":"嚢胞径が4 cmを超えれば、卵巣予備能や妊娠希望にかかわらず反復手術を選ぶ。","E":"術後に妊娠希望がすぐでなければ、ホルモン抑制療法は再発・疼痛再燃低下に寄与しうる。"},"correct":["A","B","C","E"],"comments":{"A":"正しい。近年は画像と症状による臨床診断の位置づけが大きい。","B":"正しい。嚢胞摘出は卵巣皮質損傷やAMH低下を伴いうる。","C":"正しい。疼痛抑制薬は妊娠を目指す周期では排卵抑制が問題になる。","D":"誤り。妊娠希望、嚢胞所見、卵巣予備能、既往手術歴を統合する。","E":"正しい。術後抑制療法は再発抑制に有用だが、妊娠希望直後では使いにくい。"},"rationale":"内膜症では、痛み、嚢胞、妊娠希望、悪性所見、AMH、既往手術歴を同時に考える。若年・妊孕性希望例で過剰手術を避けるのが試験のひっかけである。","references":["ESHRE Guideline Group. ESHRE guideline: endometriosis. Hum Reprod Open. 2022;2022:hoac009. DOI:10.1093/hropen/hoac009. 反映: 臨床診断、薬物療法、手術適応、妊孕性配慮。","Zakhari A, et al. Endometriosis recurrence following post-operative hormonal suppression: a systematic review and meta-analysis. Hum Reprod Update. 2021;27:96-107. DOI:10.1093/humupd/dmaa033. 反映: 術後ホルモン抑制の再発抑制。"],"numeric":true},{"number":10,"theme":"PMS / PMDD","stem":"34歳。月経前7日から怒りっぽさ、不安、集中困難が強くなり、月経開始2日後には軽快するという。上司とのトラブルが続き、本人は治療を希望する。睡眠不足もあり、過去に軽躁を疑われたことがある。対応として適切なものを全て選べ。","choices":{"A":"症状が月経前にあるため、前方視的記録を待たずに気分障害の鑑別を省略する。","B":"月経周期と無関係に持続する症状であっても、黄体期に悪化すれば同じ診断でよい。","C":"少なくとも2周期程度の症状日記で周期性と機能障害を確認する。","D":"双極性障害の既往が疑われる場合、SSRI開始前に精神科的評価と躁転リスクを考える。","E":"身体症状が軽ければ、社会機能障害は治療選択に反映しない。"},"correct":["C","D"],"comments":{"A":"誤り。周期性確認と鑑別は重要である。","B":"誤り。基礎疾患の月経前増悪とPMDDは区別して考える。","C":"正しい。前方視的な症状記録が診断精度を上げる。","D":"正しい。双極性障害が疑われる場合、SSRI単独は慎重に扱う。","E":"誤り。PMDDでは社会・職業機能障害が重症度判断の中心になる。"},"rationale":"PMS/PMDDでは、周期性と機能障害を前方視的に確認する。うつ病、双極性障害、不安障害、甲状腺疾患などの鑑別を省かない。","references":["ACOG Clinical Practice Guideline No. 7. Management of Premenstrual Disorders. Obstet Gynecol. 2023. URL:https://www.acog.org/clinical/clinical-guidance/clinical-practice-guideline/articles/2023/12/management-of-premenstrual-disorders. 反映: 前方視的評価、SSRI、CBT、ホルモン療法。","Yonkers KA, Simoni MK. Premenstrual disorders. Am J Obstet Gynecol. 2018;218:68-74. DOI:10.1016/j.ajog.2017.05.045. 反映: PMDD診断と鑑別。直近5年内の同等レビューは確認困難。"],"numeric":false},{"number":11,"theme":"PCOS","stem":"22歳。月経は45から70日周期、多毛と難治性ざ瘡がある。BMI 28、卵巣超音波で小卵胞が多数、総テストステロン軽度高値。妊娠希望は今はない。評価・管理として適切なものを全て選べ。","choices":{"A":"成人では月経異常、高アンドロゲン、卵巣形態のうち複数を満たすかを確認し、類似疾患を除外する。","B":"耐糖能異常、脂質異常、血圧、睡眠時無呼吸、子宮内膜増殖リスクを評価する。","C":"卵巣形態だけで診断し、甲状腺機能、PRL、17-OHPの評価は不要である。","D":"妊娠希望がなければ、月経が年2回でも内膜保護は考えなくてよい。","E":"思春期では、成人と同じ卵巣形態基準を単独で診断に用いない。"},"correct":["A","B","E"],"comments":{"A":"正しい。診断は排卵障害、高アンドロゲン、卵巣形態と除外診断で行う。","B":"正しい。月経だけでなく代謝・内膜・心血管リスクを管理する。","C":"誤り。類似疾患の除外は必須である。","D":"誤り。慢性無排卵では内膜増殖のリスクを考える。","E":"正しい。思春期では卵巣形態は過剰診断につながりやすい。"},"rationale":"本症候群は月経異常だけでなく、アンドロゲン、代謝、内膜、将来の妊孕性を含める。妊娠希望の有無で治療の中心が変わる。","references":["Teede HJ, et al. Recommendations from the 2023 International Evidence-based Guideline for the Assessment and Management of Polycystic Ovary Syndrome. J Clin Endocrinol Metab. 2023;108:2447-2469. DOI:10.1210/clinem/dgad463. 反映: 成人診断、思春期診断、代謝評価。","日本産科婦人科学会. 産婦人科診療ガイドライン 婦人科外来編 2023. URL:https://www.jsog.or.jp. 反映: 国内診断枠組み。"],"numeric":true},{"number":12,"theme":"過多月経・異常子宮出血","stem":"15歳。初経から月経量が多く、今回も7日以上の出血でHb 7.8 g/dL、フェリチン低値。母も若いころから過多月経で、抜歯後出血が長引いたという。妊娠反応は陰性。対応として適切なものを全て選べ。","choices":{"A":"若年者では悪性腫瘍が少ないため、妊娠関連と全身性疾患の評価は不要である。","B":"Hb、フェリチン、凝固スクリーニング、von Willebrand病を含む出血素因を評価する。","C":"急性の循環動態、貧血症状、輸血や止血治療の要否を先に判断する。","D":"器質性病変だけでなく、排卵障害、凝固異常、医原性、妊娠関連を系統的に考える。","E":"家族歴と抜歯後出血は、凝固異常を疑う情報として扱う。"},"correct":["B","C","D","E"],"comments":{"A":"誤り。若年者でも妊娠関連、凝固異常、全身疾患の評価は必要である。","B":"正しい。重症過多月経では鉄欠乏と出血素因を評価する。","C":"正しい。急性期は循環動態と貧血の重症度を優先する。","D":"正しい。PALM-COEINの発想で系統的に鑑別する。","E":"正しい。家族歴と処置後出血はvon Willebrand病などを示唆する。"},"rationale":"若年者の重症過多月経では、妊娠除外と急性貧血対応に加え、凝固異常を忘れない。器質疾患の有無だけでは評価が不十分である。","references":["NICE. Heavy menstrual bleeding: assessment and management. NG88, updated 2021. URL:https://www.nice.org.uk/guidance/ng88. 反映: 過多月経評価、LNG-IUS、画像・子宮鏡の使い分け。","ACOG Committee Opinion No. 785. Screening and management of bleeding disorders in adolescents with heavy menstrual bleeding. Obstet Gynecol. 2019. URL:https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2019/09/screening-and-management-of-bleeding-disorders-in-adolescents-with-heavy-menstrual-bleeding. 反映: 若年者の出血素因評価。直近5年内の同等包括指針は確認困難。"],"numeric":true},{"number":13,"theme":"LEP・OCの適応","stem":"27歳。月経痛と過多月経で生活に支障がある。避妊も希望している。血圧118/72 mmHg、非喫煙、前兆を伴う片頭痛や血栓症既往はない。説明として適切なものを全て選べ。","choices":{"A":"月経痛、過多月経、避妊、周期調整に対する選択肢として提示できる。","B":"開始前には頸部細胞診、凝固系、肝機能、乳房画像を全員で終えておく必要がある。","C":"卵巣癌と子宮体癌のリスク低下を目的に、禁忌確認より優先して開始する。","D":"子宮内膜症関連疼痛では、妊娠希望の時期や禁忌を確認して選択する。","E":"避妊希望があれば、血圧や片頭痛の確認なしに開始してよい。"},"correct":["A","D"],"comments":{"A":"正しい。症状治療と避妊の両面で候補になる。","B":"誤り。全員にこれらを処方前必須検査として求めない。","C":"誤り。副効用は説明してよいが、禁忌確認や個別リスク評価より優先しない。","D":"正しい。疼痛治療と妊娠希望は両立しない時期がある。","E":"誤り。血圧、片頭痛、血栓症、乳癌、肝疾患などは確認する。"},"rationale":"適応を広く知るだけでなく、処方前に禁忌・慎重投与を拾えるかが重要である。副効用は説明してよいが、個別リスク評価を省かない。","references":["CDC. U.S. Selected Practice Recommendations for Contraceptive Use, 2024. MMWR. 2024;73(RR-3). URL:https://www.cdc.gov/mmwr/volumes/73/rr/rr7303a1.htm. 反映: 開始前評価、血圧、開始時期。","CDC. U.S. Medical Eligibility Criteria for Contraceptive Use, 2024. MMWR. 2024;73(RR-4). URL:https://www.cdc.gov/mmwr/volumes/73/rr/rr7304a1.htm. 反映: 禁忌・適格性分類。"],"numeric":false},{"number":14,"theme":"LEP・OCの禁忌、副作用、飲み忘れ","stem":"33歳。月経困難症に対するエストロゲン含有配合薬を希望する。問診で、20歳から前兆を伴う片頭痛があり、2年前に深部静脈血栓症で抗凝固療法を受けた。血圧は164/102 mmHg。判断として適切なものを全て選べ。","choices":{"A":"前兆を伴う片頭痛は、年齢が35歳未満なら安全性評価に影響しない。","B":"血栓症既往は、エストロゲン含有薬を避ける重要な理由になる。","C":"収縮期160 mmHg以上または拡張期100 mmHg以上は、エストロゲン含有薬を避ける判断に直結する。","D":"激しい下肢痛、胸痛、息切れ、視覚異常、強い頭痛などの警告症状を説明する。","E":"飲み忘れ対応では、何週目かや性交の有無を確認せず同じ指示にする。"},"correct":["B","C","D"],"comments":{"A":"誤り。前兆を伴う片頭痛では脳卒中リスクを考え、エストロゲン含有薬を避ける。","B":"正しい。血栓症既往は重要な禁忌・慎重判断である。","C":"正しい。重症高血圧はカテゴリー4相当として扱う。","D":"正しい。ACHESに相当する警告症状を説明する。","E":"誤り。飲み忘れでは錠数、週、性交、追加避妊、緊急避妊を判断する。"},"rationale":"試験では処方できる症例より、処方してはいけない症例を選べるかが問われる。片頭痛前兆、血栓症既往、重症高血圧、乳癌、肝障害などを見逃さない。","references":["CDC. U.S. Medical Eligibility Criteria for Contraceptive Use, 2024. MMWR. 2024;73(RR-4). URL:https://www.cdc.gov/mmwr/volumes/73/rr/rr7304a1.htm. 反映: 片頭痛前兆、血栓症、高血圧のカテゴリー。","CDC. Combined Hormonal Contraceptives, U.S. SPR 2024. URL:https://www.cdc.gov/contraception/hcp/usspr/combined-hormonal-contraceptives.html. 反映: 飲み忘れ、開始、警告症状説明。"],"numeric":true},{"number":15,"theme":"月経移動","stem":"24歳。10日後から5日間の競技会があり、その期間の出血を避けたい。月経は28日周期で、次回月経予定日は競技会初日。性交歴があり、片頭痛前兆はなく、血圧は122/70 mmHg、喫煙なし。説明として適切なものを全て選べ。","choices":{"A":"予定月経開始後に内服を始めても、今回の出血を遅らせる効果は十分期待できる。","B":"競技会終了まで内服を続ければ、妊娠確認や血栓リスクの確認は不要である。","C":"月経を遅らせる方法では、予定月経前から内服を開始し、イベント終了まで継続する。","D":"前兆を伴う片頭痛や血栓症既往があっても、短期使用なら確認しなくてよい。","E":"悪心だけを説明すれば十分で、不正出血、頭痛、血栓症を疑う症状は事前説明から外す。"},"correct":["C"],"comments":{"A":"誤り。出血開始後では遅延目的としては不利である。","B":"誤り。妊娠可能性と血栓リスクは短期でも確認する。","C":"正しい。遅らせる場合は予定月経前から始める。","D":"誤り。短期でもエストロゲン含有薬では禁忌確認が必要である。","E":"誤り。短期使用でも不正出血、頭痛、血栓症を疑う症状などを説明する。"},"rationale":"月経移動では投与法の細部より、妊娠除外、血栓リスク、片頭痛、喫煙、高血圧、副作用説明が問われやすい。","references":["ACOG Clinical Consensus No. 3. General approaches to medical management of menstrual suppression. Obstet Gynecol. 2022. URL:https://www.acog.org/clinical/clinical-guidance/clinical-consensus/articles/2022/09/general-approaches-to-medical-management-of-menstrual-suppression. 反映: 月経抑制・調整の共有意思決定。","CDC. U.S. Medical Eligibility Criteria for Contraceptive Use, 2024. URL:https://www.cdc.gov/mmwr/volumes/73/rr/rr7304a1.htm. 反映: 短期使用時も禁忌確認。"],"numeric":false},{"number":16,"theme":"緊急避妊","stem":"26歳。避妊なしの性交から72時間後に受診した。月経周期は不規則で、今後は確実な避妊を希望している。発熱や下腹痛はない。説明として適切なものを全て選べ。","choices":{"A":"できるだけ早く対応し、方法によって性交後120時間以内まで選択肢になりうる。","B":"妊娠成立後の中絶薬として説明し、次回月経の確認は不要である。","C":"内服後は性感染症、性暴力、継続的避妊の相談を別問題として扱い、同日に触れない。","D":"銅付加IUDは国や施設の実装差を考えず、全受診者で即時に同じように挿入する。","E":"次回月経が遅れる場合や妊娠症状がある場合は、妊娠反応で確認する。"},"correct":["A","E"],"comments":{"A":"正しい。時間依存性があり、LNG、UPA、銅IUDなどは時期と利用可能性を分けて考える。","B":"誤り。緊急避妊は妊娠成立後の中絶薬ではなく、月経・妊娠確認が必要である。","C":"誤り。STI、性暴力、継続避妊への接続は同時に扱う。","D":"誤り。銅IUDは有効だが、国内運用、感染リスク、希望、挿入可能性を確認する。","E":"正しい。完全に妊娠を防ぐわけではないため、フォローを説明する。"},"rationale":"緊急避妊は早期対応とフォローが要点である。国際標準と国内の利用可能性が異なる選択肢は、解説で分けて説明する。","references":["CDC. Emergency Contraception, U.S. Selected Practice Recommendations for Contraceptive Use, 2024. URL:https://www.cdc.gov/contraception/hcp/usspr/emergency-contraception.html. 反映: LNG、UPA、銅IUD、妊娠確認、継続避妊。","Turok DK, et al. Levonorgestrel vs. Copper Intrauterine Devices for Emergency Contraception. N Engl J Med. 2021;384:335-344. DOI:10.1056/NEJMoa2022141. 反映: IUDを緊急避妊と継続避妊に用いる考え方。"],"numeric":true},{"number":17,"theme":"STI・腟炎","stem":"23歳。帯下増加と下腹部違和感で受診した。妊娠反応は陰性。頸管擦過NAATでクラミジア陽性、淋菌陰性。発熱はなく、内診で軽い子宮頸部移動痛がある。対応として適切なものを全て選べ。","choices":{"A":"クラミジアは無症状でもPID、不妊、異所性妊娠のリスクに関与するため治療する。","B":"直近のパートナーに検査・治療を勧め、治療完了まで性行為を避けるよう説明する。","C":"淋菌陰性なら、骨盤内感染を疑う所見があっても上行感染は考えない。","D":"治療後は再感染が多いため、およそ3か月後の再検査を計画する。","E":"腟炎症状がある場合、カンジダ、細菌性腟症、トリコモナスは症状だけで確定診断できる。"},"correct":["A","B","D"],"comments":{"A":"正しい。無症候感染が多く、上行感染と将来の不妊リスクに関わる。","B":"正しい。パートナー対応は再感染予防に必須である。","C":"誤り。クラミジア単独でもPIDを起こしうる。","D":"正しい。再感染確認のため3か月程度で再検査する。","E":"誤り。腟炎はpH、鏡検、NAATなどを組み合わせて鑑別する。"},"rationale":"STIでは本人治療だけでなく、パートナー対応、性行為回避、再検査、PID評価を含める。腟炎はカンジダ、BV、トリコモナスの検査所見を整理する。","references":["Workowski KA, et al. Sexually Transmitted Infections Treatment Guidelines, 2021. MMWR Recomm Rep. 2021;70:1-187. DOI:10.15585/mmwr.rr7004a1. PMID:34292926. URL:https://www.cdc.gov/std/treatment-guidelines/default.htm. 反映: クラミジア、PID、パートナー管理、再検査。","CDC. Chlamydial Infections - STI Treatment Guidelines. URL:https://www.cdc.gov/std/treatment-guidelines/chlamydia.htm. 反映: パートナー対応と3か月再検査。"],"numeric":true},{"number":18,"theme":"外陰掻痒症・外陰痛","stem":"66歳。半年続く外陰掻痒と灼熱感。市販抗真菌薬で改善しない。外陰に白色萎縮性局面、裂隙、軽い癒着を認める。腟分泌物は少なく、KOHで菌糸を認めない。対応として適切なものを全て選べ。","choices":{"A":"カンジダが陰性でも、抗真菌薬を長期に反復すれば悪性疾患の検索は不要である。","B":"硬化性病変を疑い、高力価外用ステロイドを含む治療と長期フォローを検討する。","C":"治療抵抗性、潰瘍、硬結、色素変化、腫瘤があれば生検を考慮する。","D":"視診で明らかな異常が乏しい痛みでは、痛みの訴えを診断上無効として扱う。","E":"外陰癌や上皮内病変のリスク説明と自己観察を含めて管理する。"},"correct":["B","C","E"],"comments":{"A":"誤り。難治例では皮膚疾患、VIN、外陰癌を考える。","B":"正しい。硬化性苔癬では高力価外用ステロイドが治療の柱になる。","C":"正しい。難治性・非典型・悪性疑いでは組織診を行う。","D":"誤り。外陰痛では視診異常が乏しくても痛みを否定しない。","E":"正しい。再燃と癌化リスクのため長期フォローが必要である。"},"rationale":"外陰掻痒は感染だけではない。白色病変、びらん、潰瘍、硬結、色素変化、治療抵抗性では生検を考える。外陰痛は異常所見が乏しくても尊重する。","references":["British Association of Dermatologists. Guidelines for the management of lichen sclerosus. Br J Dermatol. 2018;178:839-853. DOI:10.1111/bjd.16241. PMID:29313867. 反映: 高力価外用ステロイド、生検、長期フォロー。近5年内の同等包括指針は確認困難。","ACOG Committee Opinion No. 673. Persistent vulvar pain. Obstet Gynecol. 2016. URL:https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2016/09/persistent-vulvar-pain. 反映: 外陰痛の評価。直近5年内の高品質文献確認困難。"],"numeric":false},{"number":19,"theme":"性暴力被害対応","stem":"19歳。知人から同意のない性的接触を受けたとして、翌朝に一人で来院した。服は袋に入れて持参しており、本人は警察に行くか迷っている。対応として適切なものを全て選べ。","choices":{"A":"安全確認、本人の意思確認、診察・検体採取ごとの同意を行いながら進める。","B":"証拠保全のため、本人の同意を待たずに内診と写真撮影を開始する。","C":"緊急避妊、STI検査・予防、外傷評価、心理支援、ワンストップ支援センター連携を提示する。","D":"診療録には本人の発言、時刻、所見、同意の範囲を具体的に記載する。","E":"二次被害を避けるため、受診時に被害状況を聞かず、医学的対応だけで終える。"},"correct":["A","C","D"],"comments":{"A":"正しい。本人の安全と意思尊重が最優先である。","B":"誤り。証拠保全も診察も同意に基づいて行う。","C":"正しい。医学・司法・心理社会支援を並行して提示する。","D":"正しい。正確な診療録は医療と司法の両面で重要である。","E":"誤り。必要な情報を安全に、責めない形で確認する。"},"rationale":"性暴力被害対応では、本人の意思を中心に、安全確保、証拠保全、妊娠予防、STI対応、心理支援、記録を統合する。同意のない通報や診察は避ける。","references":["WHO. Responding to intimate partner violence and sexual violence against women: WHO clinical and policy guidelines. 2013. URL:https://www.who.int/publications/i/item/9789241548595. 反映: First-line support、安全、同意、心理支援。直近5年内の同等包括指針は確認困難。","CDC. Sexual Assault and Abuse and STIs - STI Treatment Guidelines. 2021. URL:https://www.cdc.gov/std/treatment-guidelines/sexual-assault-adults.htm. 反映: STI予防、妊娠予防、フォロー。"],"numeric":true},{"number":20,"theme":"性別違和・性同一性障害","stem":"16歳。出生時に女性とされたが、男性として学校生活を送りたいと相談した。月経が強い苦痛となり、母は支持的だが父は反対している。本人は将来の妊娠可能性についても迷っている。対応として適切なものを全て選べ。","choices":{"A":"本人の訴えは未成年では診療対象にせず、保護者全員の意見が一致するまで支援を行わない。","B":"呼称、名前、診療録の取り扱い、待合での呼び出しなどプライバシーに配慮する。","C":"月経抑制を希望する場合、妊娠可能性や避妊、骨・気分への影響は説明しない。","D":"自殺念慮、抑うつ、不登校、家族・学校での安全を評価し、多職種支援につなげる。","E":"ホルモン療法を考える前に、生殖機能温存の選択肢と限界を本人の理解に合わせて説明する。"},"correct":["B","D","E"],"comments":{"A":"誤り。未成年でも苦痛と安全を評価し、本人の意思を尊重した支援を行う。","B":"正しい。呼称とプライバシーは医療アクセスを守る基本である。","C":"誤り。月経抑制でも妊娠可能性、避妊、骨、気分、可逆性を説明する。","D":"正しい。精神的苦痛と自殺リスク、学校・家庭環境を評価する。","E":"正しい。治療前に妊孕性温存を話し合う。"},"rationale":"この領域では、本人を治すのではなく苦痛を減らし安全に生活できるよう支援する。未成年では発達段階、家族、学校、多職種連携、妊孕性温存を丁寧に扱う。","references":["Coleman E, et al. Standards of Care for the Health of Transgender and Gender Diverse People, Version 8. Int J Transgend Health. 2022;23:S1-S259. DOI:10.1080/26895269.2022.2100644. 反映: 性自認尊重、個別評価、多職種支援、妊孕性温存。","ACOG Committee Opinion No. 823. Health care for transgender and gender diverse individuals. Obstet Gynecol. 2021. URL:https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2021/03/health-care-for-transgender-and-gender-diverse-individuals. 反映: 包括的・尊重的ケア、避妊、月経管理。"],"numeric":false}];
const STORAGE_KEY="womens_med_20260704_adolescent_menstrual_sexual_health_20q_v1";
const LETTERS=["A","B","C","D","E"];
let state={answers:{},memos:{}};
let storageOk=true;
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function normalize(v){const seen=new Set();String(v||"").toUpperCase().split("").forEach(ch=>{if(LETTERS.includes(ch))seen.add(ch)});return LETTERS.filter(ch=>seen.has(ch)).join("")}
function same(a,b){return normalize(a)===LETTERS.filter(ch=>b.includes(ch)).join("")}
function warn(m){const el=$("#storage-warning");el.hidden=false;el.textContent=m}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=JSON.parse(raw);state.answers=state.answers||{};state.memos=state.memos||{}}catch(e){storageOk=false;warn("保存データを読み込めませんでした。入力は続けられます。")}}
function save(){if(!storageOk)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$("#save-status").textContent="保存しました。"}catch(e){storageOk=false;warn("localStorageへ保存できませんでした。画面上の入力は続けられます。")}}
function renderQuestions(){
  $("#questions-root").innerHTML=QUESTIONS.map(q=>`<article class="question-card" data-question="${q.number}"><h3><span class="qno">第${q.number}問</span></h3><p class="stem">${esc(q.stem)} 正しいものを全て選べ。</p><div class="choices" role="group" aria-label="第${q.number}問の選択肢">${LETTERS.map(L=>`<button type="button" class="choice" data-q="${q.number}" data-choice="${L}" aria-pressed="false"><span class="letter">${L}</span><span>${esc(q.choices[L])}</span></button>`).join("")}</div><div class="answer-row"><div><label for="answer-${q.number}">回答記入欄</label><input id="answer-${q.number}" class="answer-input" data-q="${q.number}" maxlength="5" inputmode="latin" autocomplete="off" aria-label="第${q.number}問の回答記入欄"><div class="hint">A-Eのみ保存</div></div><div><label for="memo-${q.number}">メモ欄</label><textarea id="memo-${q.number}" data-q="${q.number}" aria-label="第${q.number}問のメモ欄"></textarea></div></div></article>`).join("");
  QUESTIONS.forEach(q=>{const a=$(`#answer-${q.number}`),m=$(`#memo-${q.number}`);a.value=normalize(state.answers[q.number]||"");m.value=state.memos[q.number]||"";updateChoice(q.number)});
}
function renderExplanations(){
  $("#explanations-root").innerHTML=QUESTIONS.map(q=>`<article class="explain-card" data-explanation="${q.number}"><h3><span class="qno">第${q.number}問</span></h3><p><span class="theme-pill">関連テーマ：${esc(q.theme)}</span> <span class="judge blank" data-judge="${q.number}">未回答</span></p><h4>問題文の再掲</h4><div class="reprint"><p class="stem">${esc(q.stem)} 正しいものを全て選べ。</p></div><h4>A、B、C、D、Eの選択肢の再掲</h4><div class="reprint">${LETTERS.map(L=>`<p><strong>${L}</strong> ${esc(q.choices[L])}</p>`).join("")}</div><p><strong>答案者の回答：</strong><span data-exam-answer="${q.number}">未回答</span></p><p><strong>正答：</strong>${q.correct.join("")}</p><h4>各選択肢へのコメント</h4>${LETTERS.map(L=>`<div class="option-comment ${q.correct.includes(L)?"correct":""}"><strong>${L}：</strong>${esc(q.comments[L])}</div>`).join("")}<div class="key-point"><strong>概要：</strong>${esc(q.rationale)}</div><h4>根拠文献</h4><ul class="refs">${q.references.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></article>`).join("");
  QUESTIONS.forEach(q=>updateJudge(q.number));
}
function setAnswer(n,v){const ans=normalize(v);if(ans)state.answers[n]=ans;else delete state.answers[n];const input=$(`#answer-${n}`);if(input&&input.value!==ans)input.value=ans;updateChoice(n);updateJudge(n);renderSummary();save()}
function toggle(n,L){const cur=new Set(normalize(state.answers[n]||"").split("").filter(Boolean));cur.has(L)?cur.delete(L):cur.add(L);setAnswer(n,LETTERS.filter(x=>cur.has(x)).join(""))}
function setMemo(n,v){state.memos[n]=v;renderSummary();save()}
function updateChoice(n){const ans=normalize(state.answers[n]||"");document.querySelectorAll(`.choice[data-q="${n}"]`).forEach(btn=>{const on=ans.includes(btn.dataset.choice);btn.classList.toggle("selected",on);btn.setAttribute("aria-pressed",on?"true":"false")})}
function updateJudge(n){const q=QUESTIONS.find(x=>x.number===Number(n));if(!q)return;const ans=normalize(state.answers[n]||""),a=document.querySelector(`[data-exam-answer="${n}"]`),j=document.querySelector(`[data-judge="${n}"]`);if(a)a.textContent=ans||"未回答";if(j){const ok=ans&&same(ans,q.correct);j.className="judge "+(!ans?"blank":ok?"ok":"bad");j.textContent=!ans?"未回答":ok?"正解":"不正解"}}
function renderSummary(){$("#summary-root").innerHTML=QUESTIONS.map(q=>{const ans=normalize(state.answers[q.number]||"")||"未回答",memo=state.memos[q.number]||"";return `<div class="summary-item"><strong>第${q.number}問</strong>\n回答：${esc(ans)}\nメモ：${esc(memo||"なし")}</div>`}).join("")}
function summaryText(){return QUESTIONS.map(q=>{const ans=normalize(state.answers[q.number]||"")||"未回答";const memo=state.memos[q.number]||"なし";return "第"+q.number+"問\n回答："+ans+"\nメモ："+memo}).join("\n\n")}
async function copySummary(){const t=summaryText(),s=$("#copy-status");try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);s.textContent="コピーしました。";return}}catch(e){}const ta=document.createElement("textarea");ta.value=t;ta.readOnly=true;ta.style.position="fixed";ta.style.left="-9999px";document.body.appendChild(ta);ta.select();try{s.textContent=document.execCommand("copy")?"コピーしました。":"コピーできませんでした。"}catch(e){s.textContent="コピーできませんでした。"}document.body.removeChild(ta)}
function clearAll(){if(!confirm("入力内容をすべて消去します。よろしいですか？"))return;state={answers:{},memos:{}};try{localStorage.removeItem(STORAGE_KEY)}catch(e){}QUESTIONS.forEach(q=>{const a=$(`#answer-${q.number}`),m=$(`#memo-${q.number}`);if(a)a.value="";if(m)m.value="";updateChoice(q.number);updateJudge(q.number)});renderSummary();$("#save-status").textContent="消去しました。"}
document.addEventListener("DOMContentLoaded",()=>{load();renderQuestions();renderSummary();renderExplanations();document.addEventListener("click",e=>{const b=e.target.closest(".choice");if(b)toggle(Number(b.dataset.q),b.dataset.choice)});document.addEventListener("input",e=>{if(e.target.classList.contains("answer-input"))setAnswer(Number(e.target.dataset.q),e.target.value);if(e.target.tagName==="TEXTAREA")setMemo(Number(e.target.dataset.q),e.target.value)});$("#copy-btn").addEventListener("click",copySummary);$("#clear-btn").addEventListener("click",clearAll)});
</script>
